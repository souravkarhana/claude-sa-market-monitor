name: Daily EOD update

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST, Monday to Friday (bhavcopy is out by then)
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python update.py
      - name: Commit new data
        run: |
          git config user.name "sa-monitor-bot"
          git config user.email "sa-monitor-bot@users.noreply.github.com"
          git add data.json history.csv.gz
          git diff --cached --quiet || git commit -m "EOD data update $(date -u +%F)"
          git push
